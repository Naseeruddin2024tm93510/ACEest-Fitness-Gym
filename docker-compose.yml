version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aceest-backend-${BRANCH_NAME:-prod}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - fitness-db:/data
    environment:
      - DB_DIR=/data
    networks:
      - aceest-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aceest-frontend-${BRANCH_NAME:-prod}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - aceest-network

networks:
  aceest-network:
    driver: bridge

volumes:
  fitness-db:
