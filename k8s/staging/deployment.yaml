# =============================================================================
# ACEest Fitness & Gym — Staging Deployment
# =============================================================================
# Staging mirrors production but with fewer replicas for cost savings.
# Used for UAT and pre-production validation.
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aceest-fitness-pvc
  namespace: staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-backend
  namespace: staging
  labels:
    app: aceest-fitness
    env: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-fitness
      env: staging
  template:
    metadata:
      labels:
        app: aceest-fitness
        env: staging
    spec:
      containers:
      - name: backend
        image: naseeruddin786/aceest-backend:staging-latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_DIR
          value: "/data"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: db-storage
          mountPath: /data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: aceest-fitness-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-service
  namespace: staging
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30081
  selector:
    app: aceest-fitness
    env: staging
