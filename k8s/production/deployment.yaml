# =============================================================================
# ACEest Fitness & Gym — Production Deployment (Rolling Update Strategy)
# =============================================================================
# Rolling Update: Gradually replaces old pods with new ones.
# - maxSurge: 1        → At most 1 extra pod during update
# - maxUnavailable: 0  → Zero downtime guaranteed
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aceest-fitness-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-backend
  namespace: production
  labels:
    app: aceest-fitness
    env: production
    version: stable
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-fitness
      env: production
  template:
    metadata:
      labels:
        app: aceest-fitness
        env: production
        version: stable
    spec:
      containers:
      - name: backend
        image: naseeruddin786/aceest-backend:main-latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_DIR
          value: "/data"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: db-storage
          mountPath: /data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: aceest-fitness-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-service
  namespace: production
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30080
  selector:
    app: aceest-fitness
    env: production
